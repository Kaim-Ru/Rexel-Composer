name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm render:examples
      - run: pnpm --filter rexel-composer-vscode exec vsce package --no-dependencies --out ../../rexel-composer.vsix
      - run: npm pack --pack-destination ../..
        working-directory: packages/cli
      - run: npm pack --pack-destination ../..
        working-directory: packages/plugin-api
      - run: >
          gh release create "$GITHUB_REF_NAME" --title "RexelComposer $GITHUB_REF_NAME" --generate-notes
          rexel-composer.vsix rexel-composer-*.tgz rexel-plugin-api-*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
